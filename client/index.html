<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>playAble Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-header panel">
        <div class="brand-block">
          <span class="brand-name">playAble</span>
        </div>
        <div class="control-block">
          <button id="stop-song-button" class="danger-button" type="button">Stop</button>
          <button id="recheck-defaults-button" class="menu-button" type="button">Recheck Defaults</button>
          <nav class="header-menu" aria-label="Drawer menu">
            <button id="open-songs" class="menu-button active" type="button">Songs</button>
            <button id="open-doc" class="menu-button hidden" type="button">Doc</button>
            <button id="open-mixer" class="menu-button" type="button">Mixer</button>
            <button id="open-log" class="menu-button" type="button">Log</button>
          </nav>
        </div>
        <div class="right-block">
          <div class="search-field" aria-label="Search scenes">
            <input id="scene-search" type="search" placeholder="Find a scene" />
            <button id="clear-scene-search" class="clear-search-button hidden" type="button" aria-label="Clear scene search">×</button>
          </div>
          <button id="ws-status" class="status-light status-red" type="button" aria-label="Connection status"></button>
          <span id="connection-address" class="meta hidden"></span>
        </div>
      </header>

      <div id="timer-stop-toast" class="timer-stop-toast hidden" role="status" aria-live="polite"></div>

      <section class="page-stack">
        <section id="page-songs" class="panel page songs-page active">
          <ul id="scene-list" class="scene-grid"></ul>
          <input id="song-doc-input" class="hidden" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
        </section>

        <section id="page-doc" class="panel page doc-page">
          <section id="active-song-doc" class="song-doc-panel hidden">
            <div class="song-doc-header">
              <strong id="active-song-doc-title">Song Document</strong>
              <a id="active-song-doc-open" class="song-doc-open" target="_blank" rel="noreferrer">Open in New Tab</a>
            </div>
            <iframe id="active-song-doc-frame" class="song-doc-frame" title="Song document preview"></iframe>
            <div id="active-song-doc-fallback" class="song-doc-fallback hidden"></div>
          </section>
        </section>

        <section id="page-mixer" class="panel page mixer-page">
          <div class="page-caption">
            <h2>Tracks and Buses</h2>
          </div>
          <ul id="track-list" class="track-grid"></ul>
        </section>

        <section id="page-log" class="panel page log-page">
          <div class="page-caption">
            <h2>Event Stream</h2>
          </div>
          <pre id="event-log" class="event-log"></pre>
        </section>
      </section>
    </main>

    <section id="song-meta-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="song-meta-title">
      <div class="modal-card">
        <h3 id="song-meta-title">Edit Song Notes and Tags</h3>
        <div class="modal-attachment-row">
          <button id="song-meta-attachment" type="button" class="menu-button">Attachment</button>
          <a id="song-meta-attachment-open" class="song-doc-open hidden" target="_blank" rel="noreferrer">Open current attachment</a>
        </div>
        <label class="modal-label" for="song-meta-notes">Notes</label>
        <textarea id="song-meta-notes" class="modal-notes" rows="5" maxlength="500"></textarea>

        <label class="modal-label" for="song-tag-input">Tags</label>
        <div class="modal-tag-input-row">
          <input id="song-tag-input" class="modal-tag-input" list="song-tag-suggestions" placeholder="Type tag and press Enter" />
          <button id="song-tag-add" type="button" class="menu-button">Add</button>
        </div>
        <datalist id="song-tag-suggestions"></datalist>
        <div id="song-selected-tags" class="modal-tag-list"></div>

        <div class="modal-actions">
          <button id="song-meta-cancel" type="button" class="menu-button">Cancel</button>
          <button id="song-meta-save" type="button" class="danger-button">Save</button>
        </div>
      </div>
    </section>

    <footer class="app-footer" aria-hidden="true"></footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
